<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulsar — Join</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#09090f; color:#f0eeff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:32px; }
  .card { max-width:360px; }
  .icon { font-size:52px; margin-bottom:20px; }
  .title { font-size:28px; font-weight:200; letter-spacing:6px; text-transform:uppercase; color:#fff; margin-bottom:8px; }
  .sub { font-size:14px; color:rgba(240,238,255,0.5); margin-bottom:24px; line-height:1.6; }
  .code-badge { display:inline-block; background:rgba(153,69,255,0.12); border:0.5px solid rgba(153,69,255,0.3); border-radius:8px; padding:6px 14px; font-size:13px; color:#9945ff; letter-spacing:2px; margin-bottom:24px; }
  .btn { display:inline-block; background:#9945ff; color:#fff; text-decoration:none; padding:14px 36px; border-radius:12px; font-size:16px; font-weight:500; letter-spacing:1px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛰️</div>
  <div class="title">PULSAR</div>
  <div id="codeBadge"></div>
  <div class="sub" id="sub"></div>
  <div id="cta"></div>
</div>
<script>
  const lang = (navigator.language || 'fr').slice(0,2).toLowerCase();
  const FR = lang === 'fr';

  const T = {
    sub:        FR ? 'Redirection en cours...'         : 'Redirecting...',
    subPlay:    FR ? 'Ouverture du Play Store...'      : 'Opening Play Store...',
    subStore:   FR ? "Ouverture de l'App Store..."     : 'Opening App Store...',
    subDesktop: FR ? 'Télécharge Pulsar sur mobile.'   : 'Download Pulsar on mobile.',
    btnPlay:    FR ? '▶ Google Play'                   : '▶ Google Play',
    codeLabel:  FR ? 'Code parrain : '                 : 'Referral code: ',
  };

  document.getElementById('sub').textContent = T.sub;

  // Code depuis query param (routé par 404.html) ou path direct
  const params = new URLSearchParams(window.location.search);
  const parts  = window.location.pathname.replace(/\/$/, '').split('/');
  const refIdx = parts.indexOf('ref');
  const code   = params.get('code') ||
                 (refIdx >= 0 && parts[refIdx + 1] ? parts[refIdx + 1] : '');

  const PLAY_URL = 'https://play.google.com/store/apps/details?id=com.pulsar.mine'
    + (code ? '&referrer=' + encodeURIComponent('ref_code=' + code) : '');
  const APP_URL  = 'https://apps.apple.com/app/id0000000000'; // à remplir au lancement iOS

  if (code) {
    document.getElementById('codeBadge').innerHTML =
      '<div class="code-badge">' + T.codeLabel + code + '</div>';
  }

  const isAndroid = /Android/i.test(navigator.userAgent);
  const isIOS     = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  function redirect(){
    if (isAndroid) {
      document.getElementById('sub').textContent = T.subPlay;
      window.location.href = PLAY_URL;
    } else if (isIOS) {
      document.getElementById('sub').textContent = T.subStore;
      window.location.href = APP_URL;
    } else {
      document.getElementById('sub').textContent = T.subDesktop;
      document.getElementById('cta').innerHTML =
        '<a href="' + PLAY_URL + '" class="btn">' + T.btnPlay + '</a>';
    }
  }

  setTimeout(redirect, 500);
</script>
</body>
</html>
