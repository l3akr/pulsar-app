<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulsar — Rejoindre</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#09090f; color:#f0eeff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:32px; }
  .card { max-width:360px; }
  .icon { font-size:52px; margin-bottom:20px; }
  .title { font-size:28px; font-weight:200; letter-spacing:6px; text-transform:uppercase; color:#fff; margin-bottom:8px; }
  .sub { font-size:14px; color:rgba(240,238,255,0.5); margin-bottom:32px; line-height:1.6; }
  .btn { display:inline-block; background:#9945ff; color:#fff; text-decoration:none; padding:14px 36px; border-radius:12px; font-size:16px; font-weight:500; letter-spacing:1px; }
  .code-badge { display:inline-block; background:rgba(153,69,255,0.12); border:0.5px solid rgba(153,69,255,0.3); border-radius:8px; padding:6px 14px; font-size:13px; color:#9945ff; letter-spacing:2px; margin-bottom:24px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛰️</div>
  <div class="title">PULSAR</div>
  <div id="codeBadge"></div>
  <div class="sub" id="sub">Redirection en cours...</div>
  <div id="cta"></div>
</div>
<script>
  // Le code est dans le path après /ref/ : pulsarminer.space/ref/ABCD1234
  // Sur GitHub Pages, le path contient tout ce qui est après le domaine
  const parts = window.location.pathname.replace(/\/$/, '').split('/');
  // Cherche "ref" dans le path et prend ce qui suit
  const refIdx = parts.indexOf('ref');
  const code = refIdx >= 0 && parts[refIdx + 1] ? parts[refIdx + 1] : '';

  const isIOS     = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isAndroid = /Android/i.test(navigator.userAgent);

  const PLAY_URL = 'https://play.google.com/store/apps/details?id=com.pulsar.mine'
    + (code ? '&referrer=' + encodeURIComponent('ref_code=' + code) : '');
  const APP_URL  = 'https://apps.apple.com/app/id0000000000'; // à remplir au lancement iOS

  if (code) {
    document.getElementById('codeBadge').innerHTML =
      '<div class="code-badge">Code parrain : ' + code + '</div>';
  }

  function redirect() {
    if (isAndroid) {
      document.getElementById('sub').textContent = 'Ouverture du Play Store...';
      window.location.href = PLAY_URL;
    } else if (isIOS) {
      document.getElementById('sub').textContent = "Ouverture de l'App Store...";
      window.location.href = APP_URL;
    } else {
      document.getElementById('sub').textContent = 'Télécharge Pulsar sur ton mobile pour rejoindre.';
      document.getElementById('cta').innerHTML =
        '<a href="' + PLAY_URL + '" class="btn">▶ Google Play</a>';
    }
  }

  setTimeout(redirect, 500);
</script>
</body>
</html>
